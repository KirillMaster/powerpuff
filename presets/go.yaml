# Пресет Go. Читает scripts/profile_init.py; формат и условия `needs` - docs/profile.md.
# Не проверен на реальном репозитории (составлен по документации инструментов).
# Инструменты: go, gofmt; golangci-lint; go-arch-lint; gremlins (go-gremlins); lizard.
# Проверка gofmt: сам `gofmt -l` всегда выходит с 0, поэтому обёртка на python по выводу.
stack: go
detect: ["go.mod"]
gates:
  iteration: [format, vet, lint, build]
  unit: [tests, coverage, diff-coverage, architecture, duplication, size, complexity]
  final: [tests-full, mutation]
commands:
  format: 'python -c "import subprocess as s,sys;r=s.run(sys.argv[1:],capture_output=True,text=True);print(r.stdout);sys.exit(bool(r.stdout.strip()))" gofmt -l .'
  vet: 'go vet ./...'
  lint: 'golangci-lint run'
  build: 'go build ./...'
  tests: 'go test ./...'
  coverage: 'go test -coverprofile=cover.out ./...'
  diff-coverage: 'python "{plugin}/scripts/diff_gates.py" coverage --base {base} --report cover.out --min 80'
  architecture: 'go-arch-lint check'
  duplication: 'python "{plugin}/scripts/diff_gates.py" duplication --base {base} --max-new 0'
  size: 'python "{plugin}/scripts/diff_gates.py" size --base {base} --max-lines 400 --exclude "quality-report*.json" --exclude powerpuff.yaml --exclude ".powerpuff-*" --exclude cover.out'
  complexity: 'lizard -l go --csv -x "*/vendor/*" . > "{root}/.powerpuff-lizard.csv" && python "{plugin}/scripts/diff_gates.py" complexity --base {base} --report "{root}/.powerpuff-lizard.csv" --max 15'
  tests-full: 'go test -race ./...'
  mutation: 'gremlins unleash'
format_fix: 'gofmt -w .'
needs:
  format: "tool:gofmt+tool:python"
  format_fix: "tool:gofmt"
  vet: "tool:go"
  lint: "tool:golangci-lint"
  build: "tool:go"
  tests: "tool:go+tests:*_test.go"
  coverage: "tool:go+tests:*_test.go"
  diff-coverage: "gate:coverage"
  architecture: "tool:go-arch-lint+file:.go-arch-lint.yml|.go-arch-lint.yaml"
  complexity: "tool:lizard"
  tests-full: "tool:go+tests:*_test.go"
  mutation: "tool:gremlins+tests:*_test.go"
global: [duplication, size]
protected: [".golangci.yml", ".golangci.yaml", ".golangci.toml", ".go-arch-lint.yml", ".go-arch-lint.yaml", ".github/workflows/**"]
test_gates: [tests]
